# Nightly benchmark (ADR-005): agent-generated screens scored deterministically
# vs the committed raw-Tailwind baseline. Report-only — losses are logged, not
# merge-blocking. Default mode is FIXTURE REPLAY: the committed recorded
# generations in tooling/validate/benchmark/recordings/ produce a full
# scoreboard offline, with zero credentials. The generator command stays
# pluggable for clients who wire their own agent CLI + keys.
name: nightly-benchmark

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build registries
        run: pnpm build

      - name: Install chromium for the axe column (optional, auto-skips if absent)
        run: pnpm --filter @ds/validate exec playwright install chromium
        continue-on-error: true

      - name: Run benchmark harness (fixture replay, report-only)
        # Fixture replay is the credential-free default. To benchmark a real
        # generator, append:
        #   --generator '{"name":"claude","cmd":"claude -p \"$SCENARIO_PROMPT ... write files to $SCENARIO_OUT\""}'
        # Generators are NEVER invoked from tests or merge-blocking CI, and the
        # client provides any credentials their CLI needs.
        run: pnpm --filter @ds/validate run benchmark -- --report-only

      # The benchmark run appended a metrics line; render and preserve the trend.
      # Deliberately NOT pushed back as a commit from CI (see validate.yml).
      - name: Render metrics report
        run: pnpm --filter @ds/validate run metrics:report

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tooling/validate/benchmark-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/
          if-no-files-found: warn
