# Merge-blocking validation (ADR-005): the deterministic gauntlet + eval
# regression run + benchmark scorer self-test. No LLM anywhere in this path.
name: validate

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (tokens -> react -> generate -> context -> mcp)
        run: pnpm build

      # ADR-004: "CI recompiles and diffs" — the build above just re-ran the
      # generators; any diff against the committed generated files means a
      # stale or hand-edited registry/barrel landed in the commit.
      - name: Generated files match their sources (git diff after regenerate)
        run: git diff --exit-code registries/ packages/react/src/index.ts

      - name: Validation gauntlet (typecheck -> lint -> build -> test -> registry-check)
        run: pnpm validate

      - name: Eval regression run (critical 1.0, overall >= 0.95)
        run: pnpm --filter @ds/validate run evals

      - name: Benchmark scorer self-test (dry-run over committed fixtures, no generator)
        run: pnpm --filter @ds/validate run benchmark -- --dry-run --no-axe

      # Metrics per release (brief §8): the gauntlet + eval runners above each
      # appended a structured line to metrics/history.jsonl. Render the trend
      # report and ship metrics/ as a build artifact. Deliberately NOT pushed
      # back as a commit from CI — a human (or a reviewed bot PR) lands the
      # updated history; CI only proves and preserves it.
      - name: Render metrics report
        run: pnpm --filter @ds/validate run metrics:report

      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/
          if-no-files-found: warn

      - name: Upload gauntlet report on failure
        if: failure()
        run: pnpm --filter @ds/validate run gauntlet -- --json --no-metrics > gauntlet-report.json || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gauntlet-report
          path: gauntlet-report.json
          if-no-files-found: ignore

  # G6 stories-axe: browser-run axe-core (WCAG 2.x A/AA) over EVERY Storybook
  # story, gating on serious/critical violations. This is the ONE job that
  # needs a browser download (playwright chromium) — kept out of `gauntlet`
  # above so the core merge gate stays credential- and browser-free, and so
  # a flaky browser fetch can never mask a deterministic-gauntlet verdict.
  stories-axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false # the axe gate is merge-blocking, same as the gauntlet
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install chromium (the only browser download in this workflow)
        run: pnpm --filter @ds/validate exec playwright install --with-deps chromium

      - name: Build workspace (tokens -> react -> generate -> context -> mcp)
        run: pnpm build

      - name: Stories axe (browser-run axe over ALL Storybook stories)
        run: pnpm --filter @ds/validate run stories-axe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stories-axe-results
          path: tooling/validate/stories-axe-results/
          if-no-files-found: warn

  # M6 compliance evidence pack: one command -> auditor-ready bundle
  # (fresh-executed gauntlet + evals, WCAG evidence, provenance with artifact
  # hashes, dependency inventory from the lockfile). NON-BLOCKING: the
  # merge gate stays the deterministic gauntlet above; this job only proves
  # the evidence command works end-to-end and preserves the pack. It runs
  # browserless, so the stories-axe section carries the latest committed
  # results with an honest staleness stamp.
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so provenance can resolve tags

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace (tokens -> react -> generate -> context -> mcp)
        run: pnpm build

      # The evidence command re-executes the gauntlet + evals itself (fresh-
      # execution guarantee) and aborts without writing a pack if either fails.
      - name: Generate compliance evidence pack
        run: pnpm --filter @ds/validate run evidence --no-browser

      - uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: evidence-pack/
          if-no-files-found: error
