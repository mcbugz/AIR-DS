lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/alpha:
    dependencies:
      '@fx/beta':
        specifier: workspace:*
        version: link:../beta
      left-pad:
        specifier: ^1.3.0
        version: 1.3.0
    devDependencies:
      tiny-dev:
        specifier: ^1.0.0
        version: 1.0.0(peer-x@2.0.0)

  packages/beta:
    dependencies:
      base-lib:
        specifier: ^2.0.0
        version: 2.0.0

packages:

  base-lib@2.0.0:
    resolution: {integrity: sha512-fixture0}

  chain-dep@0.5.0:
    resolution: {integrity: sha512-fixture1}

  left-pad@1.3.0:
    resolution: {integrity: sha512-fixture2}

  peer-x@2.0.0:
    resolution: {integrity: sha512-fixture3}

  tiny-dev@1.0.0:
    resolution: {integrity: sha512-fixture4}
    peerDependencies:
      peer-x: ^2.0.0

snapshots:

  base-lib@2.0.0: {}

  chain-dep@0.5.0: {}

  left-pad@1.3.0:
    dependencies:
      chain-dep: 0.5.0

  peer-x@2.0.0: {}

  tiny-dev@1.0.0(peer-x@2.0.0):
    dependencies:
      peer-x: 2.0.0
